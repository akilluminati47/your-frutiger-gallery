<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rick Roll</title>
<!-- The hall streams {gain,pan} placement over postMessage; live-audio.js is the
     receiving half. Loaded FIRST, in <head>, so its AudioNode.connect patch and
     its capture-phase 'play' listener are armed before the video ever starts —
     the same directional sound the east quilt applies natively, here on a plain
     video. Standalone (unframed) the script is a no-op, so this page still just
     plays the clip if opened directly. -->
<script src="/live-audio.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #v {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; background: #000; display: block;
  }
</style>
</head>
<body>
  <!-- crossorigin="anonymous" is what earns the PAN half: with a CORS-clean
       source (the mp4 serves Access-Control-Allow-Origin: *), live-audio.js can
       route it through createMediaElementSource into its gain→pan tap. Without
       it the media is tainted and the receiver can only duck el.volume (gain,
       no pan) — so this attribute is load-bearing, not decorative. -->
  <video id="v"
         src="https://factcheck-answers.pages.dev/video.mp4"
         crossorigin="anonymous"
         autoplay loop playsinline></video>
  <script>
    // Autoplay-with-sound is delegated (the gallery's live iframe carries
    // allow="autoplay" and the visitor's Enter click gives top-level user
    // activation), so the clip usually starts on its own. This is just a belt:
    // if the policy still parked it, the first pointer/key inside the slab —
    // which view mode routes straight to this page — kicks it off. Either way
    // the 'play' event fires and live-audio.js adopts the element.
    const v = document.getElementById('v');
    const kick = () => { const p = v.play(); if (p && p.catch) p.catch(() => {}); };
    kick();
    for (const ev of ['pointerdown', 'keydown', 'touchstart'])
      addEventListener(ev, kick, { once: false, passive: true });
  </script>
</body>
</html>
